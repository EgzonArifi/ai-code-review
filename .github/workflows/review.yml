name: AI Code Review (reusable)

# Reusable workflow: the engine. Consumers call this via `uses:` from a tiny
# caller workflow (see examples/caller.yml). All review behavior/rules live in
# rules/*.md, checked out at run time so they can be tuned centrally.

on:
  workflow_call:
    inputs:
      stack:
        description: "Central stack rule pack(s) to load, comma-separated (e.g. 'ios' or 'backend,frontend'). Use 'none' to load no central pack (rely on custom_rules and/or general.md)."
        required: false
        type: string
        default: "none"
      custom_rules:
        description: "Comma-separated paths to rule files IN THE CONSUMER REPO (e.g. '.ai-review/frontend.md,.ai-review/api.md'). Read at run time and applied as stack packs, ABOVE the central pack. For non-template repos that own their own rules."
        required: false
        type: string
        default: ""
      model:
        description: "Model ID passed to claude-code-action. Verify current IDs periodically."
        required: false
        type: string
        default: "claude-sonnet-4-6"
      rules_ref:
        description: "Git ref of this repo to load rules from (pin to a tag like v1)."
        required: false
        type: string
        default: "v1"
      max_turns:
        description: "Max agent turns for the reviewer. Raise for large or multi-stack (monorepo) PRs."
        required: false
        type: number
        default: 60
      debug:
        description: "Append --debug so the run log shows the model's tool calls (e.g. the independent judge's Task invocation). Verbose — use to verify behavior, not on every run."
        required: false
        type: boolean
        default: false
    secrets:
      ANTHROPIC_API_KEY:
        required: true

# Reusable-workflow permissions can only be reduced by callers, not elevated —
# declare the maximum the engine needs here.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One review per PR at a time; cancel superseded runs.
    concurrency:
      group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    steps:
      # 1) Resolve the PR number + head SHA. Works for both `pull_request` and
      #    `issue_comment` events (the latter has no pull_request object, and its
      #    default checkout would grab the default branch, not the PR head).
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM="${{ github.event.pull_request.number || github.event.issue.number }}"
          if [ -z "$NUM" ]; then
            echo "Could not resolve a PR number from the event." >&2
            exit 1
          fi
          HEAD_SHA="$(gh pr view "$NUM" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)"
          echo "number=$NUM"        >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # 2) Check out the PR head at full depth (git blame/history needs it).
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      # 3) Check out the rule packs from this (public) repo into .ai-review/.
      #    No token needed — public repo. Pinned via rules_ref.
      - name: Checkout rule packs
        uses: actions/checkout@v4
        with:
          repository: EgzonArifi/ai-code-review
          ref: ${{ inputs.rules_ref }}
          path: .ai-review

      # 4) Run the reviewer. Hand-written prompt orchestrates the lean,
      #    size-gated pipeline; rules are read from disk.
      - name: Run AI review
        uses: anthropics/claude-code-action@v1
        # The reviewer is advisory and must never fail a PR's checks. A turn-cap
        # hit or transient API error is best-effort — the run still records what
        # happened (and the eval-log step below runs regardless).
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # When debug is on, print the model's full turn output (incl. Task tool
          # calls) to the job log so the independent judge sub-agent is verifiable.
          show_full_output: ${{ inputs.debug }}
          prompt: |
            You are an automated pull-request reviewer. Your #1 objective is HIGH SIGNAL, LOW NOISE.

            PR number: ${{ steps.pr.outputs.number }}
            Repository: ${{ github.repository }}
            Requested stack pack(s): ${{ inputs.stack }}
            Custom rule files: ${{ inputs.custom_rules }}

            STEP 1 — Load the rules (read every file that applies; precedence is defined at the end):
            - Read `.ai-review/rules/general.md` (the cross-stack core; it defines severity tiers,
              the confidence threshold, the skip rules, and the pipeline you must follow). ALWAYS
              load this.
            - Central stack packs: unless the requested stack is the literal value "none", then for
              EACH stack in the comma-separated list "${{ inputs.stack }}" read
              `.ai-review/rules/<stack>.md` if it exists (e.g. `.ai-review/rules/ios.md`). If it is
              "none", load no central stack pack.
            - Custom rule files: if "${{ inputs.custom_rules }}" is non-empty, then for EACH
              comma-separated path in it, read that file FROM THE REPOSITORY ROOT (the consumer's own
              repo — your current working directory, NOT `.ai-review/`) and treat it as a stack pack.
              Skip any path that does not exist and note the skip in the evaluation log. These are the
              consumer's own rules and rank ABOVE the central stack pack.
            - If a `REVIEW.md` exists at the repository root, read it and treat it as the
              HIGHEST-priority overrides for this repo.
            Follow these files exactly. If they conflict:
            REVIEW.md > custom_rules files > central stack pack > general.md.

            STEP 2 — Get the change:
            - `gh pr view ${{ steps.pr.outputs.number }}` for title/description/state.
            - `gh pr diff ${{ steps.pr.outputs.number }}` for the diff.
            - Read surrounding source with Read/Grep/Glob when a finding needs context.

            STEP 3 — Run the pipeline defined in general.md:
            - Pre-flight: if the PR is closed/draft or the diff is trivial, do minimal-to-no work
              per general.md (at most a one-line confirmation). Do not manufacture findings.
            - Size gate: trivial/small PRs → a single pass covering all dimensions.
              Substantial PRs → spawn parallel dimension sub-agents via the Agent (a.k.a. Task) tool:
              (a) bugs/correctness on the diff, (b) rules-compliance (general + stack + REVIEW.md),
              (c) git-history/blame (use `git blame`/`git log`) to classify introduced vs pre-existing.
            - Independent judge gate (the core noise control — candidates MUST be judged by a
              DIFFERENT agent than the one that found them, to avoid self-bias):
              * Reduce each candidate to a NEUTRAL claim — file:line + what is allegedly wrong —
                with the finder's justification and proposed severity removed.
              * Spawn ONE batched judge sub-agent via the Agent (a.k.a. Task) tool, giving it ONLY the diff, the
                neutral claim list, and Read/Grep/Glob to inspect code — it must NOT see the
                finder's reasoning. Instruct it to verify each claim (cite the exact file:line that
                proves it; consider intentional / handled-elsewhere / linter's-job), assign a 0–100
                confidence, and return keep|drop + reason per claim; default to drop when uncertain.
              * Keep only claims the judge confirms at/above the threshold and nit cap in
                general.md; dedupe. The judge's confidence is authoritative (shown + logged).

            STEP 4 — Report:
            - Post surviving findings as INLINE comments with
              `mcp__github_inline_comment__create_inline_comment`, each tagged with its severity and
              the JUDGE's confidence (e.g. "🔴 [conf 92]") per general.md.
            - Post ONE top-level summary comment (via `gh pr comment`) using the EXACT structured
              verdict template in general.md's Output section: **Merge confidence** (🟢/🟡/🔴 + a
              one-line rationale per the rubric), **Must fix before merge** (the 🔴 blockers; only
              if any), **Findings** tally (+ dropped count), **Risk areas touched** (sensitive
              surfaces the PR changes — show even with zero findings; only if any), and
              **Open questions** / **Notes** ONLY when non-empty. Never post the summary inline.

            STEP 5 — Evaluation log (REQUIRED; workflow observability, NOT a PR comment):
            - Using the Write tool, ALWAYS write a file named `.ai-review-log.md` in the repository
              root (your current working directory). This is a required deliverable — do it even if
              there are zero candidates (then write "No candidates.").
            - Content: a markdown table of EVERY candidate you considered — both posted AND
              dropped — with columns: `file:line | severity | conf | verdict | reason`. `verdict`
              is `posted` or `dropped`; for dropped candidates the reason must state why the
              judge or a threshold rejected it.
            - This file is read by the workflow and shown on the run Summary; it must NEVER be
              posted to the PR.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            ${{ inputs.debug && '--debug' || '' }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Task,Agent,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git blame:*),Bash(git log:*),Bash(echo:*),Read,Grep,Glob,Write"

      # Publish the reviewer's evaluation log to the run's Summary page (rendered
      # markdown, workflow-only — never touches the PR). Shows dropped findings too.
      - name: Publish evaluation log
        if: always()
        run: |
          LOG="${{ github.workspace }}/.ai-review-log.md"
          echo "===== AI REVIEW EVALUATION LOG (begin) ====="
          if [ -f "$LOG" ]; then
            cat "$LOG"
            {
              echo "## 🔎 AI review — evaluation log"
              echo
              echo "_Every candidate the reviewer considered, including those it dropped._"
              echo
              cat "$LOG"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No evaluation log was produced for this run."
            {
              echo "## 🔎 AI review — evaluation log"
              echo "_No evaluation log was produced for this run._"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "===== AI REVIEW EVALUATION LOG (end) ====="
